name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version: "1.22.x"
          cache: true

      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "以下文件未格式化："
            echo "$out"
            exit 1
          fi

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      - name: vet probe
        run: go vet -tags=contract_probe ./...

      - name: test
        run: go test -race ./...

      - name: zero dependencies
        run: |
          n="$(go list -m all | wc -l | tr -d ' ')"
          echo "modules: $n"
          test "$n" -eq 1

      - name: forbid local caches in git
        run: |
          tracked="$(git ls-files | grep -E '(^|/)\.(codegraph|cache)/' || true)"
          if [ -n "$tracked" ]; then
            echo "::error::以下本地缓存不应提交到仓库："
            echo "$tracked"
            exit 1
          fi
          echo "OK：未跟踪 .codegraph / .cache"
