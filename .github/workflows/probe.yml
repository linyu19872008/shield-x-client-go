name: Contract Probe

on:
  workflow_dispatch:
  schedule:
    # 每天 UTC 18:00（北京时间 02:00）
    - cron: "0 18 * * *"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: "11111111"
          MYSQL_DATABASE: shield_x_probe
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p11111111"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: checkout client-go
        uses: actions/checkout@v4

      - name: checkout shield-x
        uses: actions/checkout@v4
        with:
          repository: linyu19872008/shield-x
          path: shield-x
          ssh-key: ${{ secrets.CI_READ_KEY }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: shield-x/go.mod
          cache: false

      - name: run self-contained probe
        run: |
          chmod +x scripts/probe-e2e.sh
          ./scripts/probe-e2e.sh
